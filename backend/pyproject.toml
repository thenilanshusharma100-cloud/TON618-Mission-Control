[project]
name = "ton618-backend"
version = "0.1.0"
description = "TON618 Mission Control backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "numpy>=2.5.4",
    "pint>=0.26.2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP037 conflicts with the quoted forward references SQLAlchemy and Pydantic
# require for circular/nested model annotations.
ignore = ["UP037"]
